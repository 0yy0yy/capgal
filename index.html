<!DOCTYPE html>
<html lang="en" data-theme="android">

<head>
   <meta charset=" UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Bottle cap gallery</title>

   <link rel="icon" type="image/svg+xml" href="./src/icons/cap-black.svg">
   <link rel="icon" type="image/svg+xml" href="./src/icons/cap-white.svg" media="(prefers-color-scheme: dark)">

   <link rel="stylesheet" href="./src/css/base.css">
   <script src="./src/js/app.js" type="module"></script>
</head>

<body>
   <main>
      <!-- ── NARROW TOPBAR (hidden on wide screens) ── -->
      <div id="topbar">
         <button type="button" id="menuToggle" aria-label="Open menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
         </button>
         <span id="topbarTitle">Cap Collection</span>
      </div>
      <!-- ── FABS BACKDROP (narrow only) ── -->
      <div id="fabs-backdrop"></div>

      <!-- ── SIDEBAR ── -->
      <section id="fabs">
         <button type="button" id="addCategoryButton">Add category</button>
         <button type="button" id="addCapButton">Add cap</button>
         <button type="button" id="searchButton">Search</button>
         <hr />
         <div class="spacer"></div>
         <button type="button" id="settingsButton">Settings</button>
      </section>

      <!-- ── TAB CONTAINER (nav stack) ── -->
      <div id="tab-container">

         <!-- CATEGORIES -->
         <section id="categories" class="tab active">
            <ul>
               <li><button type="button" data-cat="all" class="cat-btn selected">ALL caps</button></li>
               <li><button type="button" data-cat="blue" class="cat-btn">Blue</button></li>
               <li><button type="button" data-cat="red" class="cat-btn">Red</button></li>
               <li><button type="button" data-cat="vintage" class="cat-btn">Vintage</button></li>
            </ul>
         </section>

         <!-- GALLERY -->
         <section id="gallery" class="tab">
            <div class="tab-header">
               <button class="back-btn" id="galleryBack">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                     <polyline points="15 18 9 12 15 6" />
                  </svg>
                  Categories
               </button>
               <h1 id="galleryTitle">ALL</h1>
               <input type="color" id="galleryColor" />
               <button type="button" id="deleteButton" title="Delete category" hidden></button>
            </div>
            <div class="gallery-scroll">
               <div id="stickyTop">
                  <div id="searchBar">
                     <input type="search" id="searchInput" placeholder="Search caps…" autocomplete="off" />
                  </div>
                  <div id="filterRow">
                     <div id="filters">
                        <button class="filter-chip">tag1</button>
                        <button class="filter-chip">New</button>
                        <button class="filter-chip">TAG2</button>
                     </div>
                     <div id="selecting">
                        <button class="selecting-chip">Select all</button>
                        <button class="selecting-chip">Deselect all</button>
                     </div>
                  </div>
               </div>
               <ul id="galleryList">
                  <!-- items injected by JS -->
               </ul>
            </div>
         </section>

         <!-- DETAILS -->
         <section id="details" class="tab">
            <div class="tab-header">
               <button class="back-btn" id="detailsBack">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                     <polyline points="15 18 9 12 15 6" />
                  </svg>
                  Gallery
               </button>
               <h1 id="detailsTitle" contenteditable="true">Cap</h1>
               <button type="button" id="deleteButton" title="Delete cap"></button>
            </div>
            <div class="details-body">
               <img id="detailsImage" src="" alt="" />
               <div class="details-meta">
                  <label>
                     <span class="meta-key" for="tag">Tag</span>
                     <select type="text" class="meta-val" id="detailsTag" name="tag">
                        <option value="tag1">TAG1</option>
                        <option value="tag2">TAG2</option>
                        <option value="tag3" selected>TAG3</option>
                        <option value="tag4">TAG4</option>
                     </select>
                  </label>
                  <label>
                     <span class="meta-key" for="description">Description</span>
                     <textarea class="meta-val" id="detailsDesc" name="description" maxlength="280"></textarea>
                     <!-- <input type="text" class="meta-val" id="detailsDesc" name="description"> -->
                  </label>
                  <!-- <label>
                     <span class="meta-key">Category</span>
                     <input type="text" class="meta-val" id="detailsCat" name="category">
                     <span class="meta-val" id="detailsCat">—</span>
                  </label> -->
               </div>
            </div>
         </section>

         <!-- SETTINGS backdrop + sheet (overlay, NOT a nav-stack tab) -->
         <div id="settings-backdrop"></div>
         <section id="settings">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
               <h2>Settings</h2>
               <button class="sheet-close" id="settingsClose" aria-label="Close">✕</button>
            </div>
            <div class="sheet-body">
               <div class="setting-row">
                  <span class="setting-label">Theme</span>
                  <div class="settings-buttons">
                     <button class="theme-btn selected" data-theme-pref="auto">Device</button>
                     <button class="theme-btn" data-theme-pref="light">Light</button>
                     <button class="theme-btn" data-theme-pref="dark">Dark</button>
                  </div>
               </div>
               <div class="setting-row">
                  <span class="setting-label">Appearance</span>
                  <div class="settings-buttons">
                     <button class="theme-btn selected" data-theme-val="android">Android</button>
                     <button class="theme-btn" data-theme-val="ios">iOS</button>
                  </div>
               </div>
               <div class="setting-row">
                  <span class="setting-label">Show cap names in gallery</span>
                  <div class="settings-buttons">
                     <button class="theme-btn selected" data-button-val="yes">Yes</button>
                     <button class="theme-btn" data-button-val="no">No</button>
                  </div>
               </div>
               <hr>
               <div class="setting-row">
                  <span class="setting-label">Github API key</span>
                  <!-- insert the fine-grained token to be able to post data on the github repo -->
               </div>
               <div class="setting-row">
                  <span class="setting-label">Automatic saving</span>
                  <!-- if yes first set a passphrase to encript the saved data -->
                  <div class="settings-buttons">
                     <button class="theme-btn selected" data-button-val="yes">Yes</button>
                     <button class="theme-btn" data-button-val="no">No</button>
                  </div>
               </div>
               <hr>
               <div class="setting-row">
                  <span class="setting-label">Import data</span>
                  <!-- import backup from device or from github repo with the correct passphrase -->
               </div>
               <div class="setting-row">
                  <span class="setting-label">Export data</span>
                  <!-- export to device as a backup or as all the gallery data files (maybe in a zip) -->
               </div>
            </div>
         </section>

      </div><!-- #tab-container -->
   </main>
</body>

</html>
